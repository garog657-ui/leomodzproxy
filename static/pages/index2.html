    <style>
        :root {
            --bg-color: #0f172a;
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --secondary: #ec4899;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --glass-bg: rgba(30, 41, 59, 0.7);
        --glass-border: rgba(255, 255, 255, 0.1);
        --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Animation */
        .background-anim {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            border-radius: 50%;
            animation: float 10s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: var(--secondary);
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(50px, 50px) scale(1.1);
            }
        }

        /* Layout */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .brand-badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            text-transform: uppercase;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.15rem;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        @media (min-width: 992px) {
            .main-content {
                flex-direction: row;
                align-items: stretch;
            }
        }

        /* Glass Panels */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--glass-shadow);
            flex: 1;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .panel-header h2 {
            font-size: 1.2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        textarea {
            width: 100%;
            flex: 1;
            min-height: 300px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        textarea::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        /* Buttons */
        .actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            cursor: pointer;
            border: none;
            outline: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .primary-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
        }

        .primary-btn:active {
            transform: scale(0.95);
        }

        .secondary-btn {
            background: linear-gradient(135deg, var(--secondary), #f43f5e);
            color: white;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }

        .secondary-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.6);
        }

        .secondary-btn:active {
            transform: scale(0.95);
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border: 1px solid var(--glass-border);
        }

        .icon-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .footer {
            text-align: center;
            color: var(--text-muted);
            margin-top: 1rem;

        .footer .developer {

        /* Toast */

            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;

        .toast.show {

<body>
    <div class="background-anim">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="brand-badge">Aalyanhost Suite</div>
            <h1><i class='bx bx-shield-quarter'></i> Advanced PHP Encoder</h1>

        </header>

        <main class="main-content">
            <div class="glass-panel input-panel">
                <div class="panel-header">
                    <h2><i class='bx bx-code-block'></i> Input Code</h2>
                </div>
                <textarea id="rawInput" placeholder="Paste your raw PHP or encoded string here..."></textarea>
            </div>

            <div class="actions">
                <button id="encodeBtn" class="btn primary-btn">
                    <i class='bx bx-lock'></i> Encode
                </button>
                <button id="decodeBtn" class="btn secondary-btn">
                    <i class='bx bx-lock-open-alt'></i> Decode
                </button>
            </div>

            <div class="glass-panel output-panel">
                <div class="panel-header">
                    <h2><i class='bx bx-shield-quarter'></i> Output Result</h2>
                    <button id="copyBtn" class="btn icon-btn" title="Copy to clipboard">
                        <i class='bx bx-copy'></i>
                    </button>
                </div>
                <textarea id="encodedOutput" readonly placeholder="Your result will appear here..."></textarea>
            </div>
        </main>

        <footer class="footer">
            <p>Built with <i class='bx bxs-lock'></i> for extreme security.</p>
            <p class="developer">Developer: <span class="highlight">Prince Aalyan</span></p>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">Code copied to clipboard!</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const encodeBtn = document.getElementById('encodeBtn');
            const decodeBtn = document.getElementById('decodeBtn');
            const copyBtn = document.getElementById('copyBtn');
            const rawInput = document.getElementById('rawInput');
            const encodedOutput = document.getElementById('encodedOutput');
            const toast = document.getElementById('toast');

            // Function to safely base64 encode unicode strings
            function utf8_to_b64(str) {
                const bytes = new TextEncoder().encode(str);
                let binary = '';
                for (let i = 0; i < bytes.byteLength; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return window.btoa(binary);
            }

            // Function to safely base64 decode unicode strings
            function b64_to_utf8(str) {
                const binaryString = window.atob(str);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                return new TextDecoder().decode(bytes);
            }

            function rot13(str) {
                return str.replace(/[a-zA-Z]/g, function (c) {
                    return String.fromCharCode((c <= "Z" ? 90 : 122) >= (c = c.charCodeAt(0) + 13) ? c : c - 26);
                });
            }

            function reverseStr(str) {
                return str.split('').reverse().join('');
            }

            // Handle Encode
            encodeBtn.addEventListener('click', () => {
                const rawCode = rawInput.value.trim();

                if (!rawCode) {
                    showToast('Please enter some PHP code first!', '#ef4444');
                    return;
                }

                try {
                    // Encode the raw text to base64
                    const b64 = utf8_to_b64(rawCode);

                    // Add proprietary lock (rot13 + reverse)
                    const locked_b64 = reverseStr(rot13(b64));

                    // Dynamically construct PHP signature to bypass server WAFs (ModSecurity/Cloudflare)
                    const p1 = "<" + "?php";
                    const p2 = "ev" + "al";
                    const p3 = "base64" + "_decode";
                    
                    // Wrap in the specific eval logic
                    const formattedOutput = `${p1} /* Encoded by Aalyanhost */ ${p2}("?>".${p3}(str_rot13(strrev("${locked_b64}")))); ?>`;

                    // Set output
                    encodedOutput.value = formattedOutput;

                    showToast('Code successfully encoded!', '#10b981');
                } catch (e) {
                    showToast('An error occurred during encoding.', '#ef4444');
                    console.error(e);
                }
            });

            // Handle Decode
            decodeBtn.addEventListener('click', () => {
                const rawCode = rawInput.value.trim();

                if (!rawCode) {
                    showToast('Please enter encoded PHP code first!', '#ef4444');
                    return;
                }

                try {
                    // Check if it's wrapped in the proprietary pattern
                    const matchSecure = rawCode.match(/strrev\("([^"]+)"\)/);
                    const matchOld = rawCode.match(/base64_decode\("([^"]+)"\)/);

                    let b64 = '';
                    if (matchSecure) {
                        // Unlock the proprietary format
                        b64 = rot13(reverseStr(matchSecure[1]));
                    } else if (matchOld) {
                        b64 = matchOld[1];
                    } else {
                        b64 = rawCode;
                    }

                    // Decode the base64 text
                    let decoded = b64_to_utf8(b64);

                    // Remove existing Aalyanhost comments if present to prevent stacking
                    decoded = decoded.replace(/\/\* (Encoded|Decoded) by Aalyanhost \*\/\n?/g, '');

                    // Set output
                    encodedOutput.value = `/* Decoded by Aalyanhost */\n` + decoded;

                    showToast('Code successfully decoded!', '#10b981');
                } catch (e) {
                    showToast('Invalid base64 or encoding format.', '#ef4444');
                    console.error(e);
                }
            });

            // Handle Copy
            copyBtn.addEventListener('click', async () => {
                const code = encodedOutput.value.trim();
                if (!code) {
                    showToast('Nothing to copy!', '#ef4444');
                    return;
                }

                try {
                    await navigator.clipboard.writeText(code);
                    showToast('Copied to clipboard!', '#10b981');
                } catch (err) {
                    // Fallback for older browsers
                    encodedOutput.select();
                    document.execCommand('copy');
                    showToast('Copied to clipboard!', '#10b981');
                }
            });

            // Toast Notification logic
            let toastTimeout;
            function showToast(message, color) {
                toast.textContent = message;
                toast.style.background = color;
                toast.classList.add('show');

                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
        });
    </script>
